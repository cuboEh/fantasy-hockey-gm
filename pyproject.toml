[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-hockey-gm"
version = "0.1.0"
description = "Local fantasy hockey scoring and draft preparation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fantasy = "fantasy_hockey.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fantasy_hockey = ["dashboard.html"]
